name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_dist.py

  gtk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11
      - name: Check the interface without displaying a window
        env:
          PYTHONPATH: src
          GDK_BACKEND: x11
          GSETTINGS_BACKEND: memory
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/check_gtk.py
